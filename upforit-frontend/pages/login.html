<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UpForIt — Log in</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥇</text></svg>">
    <link rel="stylesheet" href="../styles.css">
</head>
<body>

    <header class="site-header">
        <a href="../index.html" style="text-decoration:none;">
            <div class="logo">
                <svg class="logo-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <path d="M35 5 L25 35 L40 42 Z" fill="currentColor"/>
                    <path d="M65 5 L75 35 L60 42 Z" fill="currentColor"/>
                    <circle cx="50" cy="60" r="30" fill="currentColor"/>
                    <text x="50" y="71" font-size="34" text-anchor="middle" fill="#12140F" font-family="Arial, sans-serif" font-weight="700">1</text>
                </svg>
                UpForIt
            </div>
        </a>
    </header>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-tabs">
                <button class="auth-tab active" id="loginTab" onclick="showLogin()">Log in</button>
                <button class="auth-tab" id="signupTab" onclick="showSignup()">Sign up</button>
            </div>

            <form id="loginForm" class="auth-form">
                <label class="auth-label">Email</label>
                <input class="auth-input" type="email" id="loginEmail" required>

                <label class="auth-label">Password</label>
                <input class="auth-input" type="password" id="loginPassword" required>

                <button type="submit" class="btn-primary auth-submit">Log in</button>
                <p class="auth-message" id="loginMessage"></p>
            </form>

            <form id="signupForm" class="auth-form" style="display:none;">
                <label class="auth-label">Name</label>
                <input class="auth-input" type="text" id="signupName" required>

                <label class="auth-label">Email</label>
                <input class="auth-input" type="email" id="signupEmail" required>

                <label class="auth-label">Password</label>
                <input class="auth-input" type="password" id="signupPassword" required>

                <button type="submit" class="btn-primary auth-submit">Create account</button>
                <p class="auth-message" id="signupMessage"></p>
            </form>
        </div>
    </div>

    <script src="../script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UpForIt — Feed</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🥇</text></svg>">
    <link rel="stylesheet" href="../styles.css">
</head>
<body>

    <header class="site-header">
        <a href="../index.html" style="text-decoration:none;">
            <div class="logo">
                <svg class="logo-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <path d="M35 5 L25 35 L40 42 Z" fill="currentColor"/>
                    <path d="M65 5 L75 35 L60 42 Z" fill="currentColor"/>
                    <circle cx="50" cy="60" r="30" fill="currentColor"/>
                    <text x="50" y="71" font-size="34" text-anchor="middle" fill="#12140F" font-family="Arial, sans-serif" font-weight="700">1</text>
                </svg>
                UpForIt
            </div>
        </a>
        <div class="header-actions">
            <div class="notif-wrapper">
                <button class="icon-btn" id="notifBellBtn" onclick="toggleNotifDropdown()">
                    🔔
                    <span class="notif-badge" id="notifBadge" style="display:none;">0</span>
                </button>
                <div class="notif-dropdown" id="notifDropdown" style="display:none;">
                    <div class="notif-dropdown-title">Notifications</div>
                    <div id="notifList"></div>
                </div>
            </div>
            <button class="btn-primary" onclick="openPostModal()">+ Post a game</button>
            <div class="profile-wrapper">
                <button class="profile-avatar" id="profileAvatarBtn" onclick="toggleProfileDropdown()">?</button>
                <div class="profile-dropdown" id="profileDropdown" style="display:none;">
                    <div class="profile-name" id="profileName">—</div>
                    <div class="profile-email" id="profileEmail">—</div>
                    <button class="profile-logout" onclick="logout()">Log out</button>
                </div>
            </div>
        </div>
    </header>

    <div class="tab-nav">
        <button class="tab-btn active" id="tabNearby" onclick="switchTab('nearby')">Nearby</button>
        <button class="tab-btn" id="tabMine" onclick="switchTab('mine')">My games</button>
        <button class="tab-btn" id="tabRsvps" onclick="switchTab('rsvps')">My RSVPs</button>
    </div>

    <main class="feed-wrapper">
        <h1 class="feed-heading" id="feedHeading">Games near you</h1>
        <div class="feed-controls" id="feedControls">
            <p class="feed-subheading" id="locationStatus">Getting your location...</p>
            <select class="radius-select" id="radiusSelect" onchange="loadNearbyGames()">
                <option value="2">Within 2 km</option>
                <option value="5">Within 5 km</option>
                <option value="10" selected>Within 10 km</option>
                <option value="20">Within 20 km</option>
                <option value="50">Within 50 km</option>
            </select>
        </div>
        <div id="gamesList" class="games-list"></div>
    </main>

    <!-- Post a game modal -->
    <div class="modal-overlay" id="postModalOverlay" style="display:none;">
        <div class="modal-card">
            <div class="modal-header">
                <h2>Post a game</h2>
                <button class="icon-btn" onclick="closePostModal()">✕</button>
            </div>
            <form id="postGameForm" class="auth-form">
                <label class="auth-label">Sport</label>
                <input class="auth-input" type="text" id="postSport" placeholder="e.g. Badminton" required>

                <label class="auth-label">Where</label>
                <input class="auth-input" type="text" id="postVenue" placeholder="e.g. DDA Courts, Sector 12" required>

                <label class="auth-label">When</label>
                <input class="auth-input" type="text" id="postTimeWindow" placeholder="e.g. 6-8 PM today" required>

                <label class="auth-label">Players needed</label>
                <input class="auth-input" type="number" id="postPlayersNeeded" min="1" placeholder="e.g. 4" required>

                <button type="submit" class="btn-primary auth-submit">Post game</button>
                <p class="auth-message" id="postMessage"></p>
            </form>
        </div>
    </div>

    <script src="../script.js"></script>
</body>
</html>
